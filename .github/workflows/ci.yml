name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The API tests run the real server against Postgres.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: combat_dnd
          POSTGRES_USER: combat
          POSTGRES_PASSWORD: combat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U combat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_DB_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Uncomment once the Fly app exists and FLY_API_TOKEN is set in the repo's secrets.
