# Local Postgres for development. Matches the defaults in backend/src/main/resources/application.yml.
# Portraits are stored in Postgres too, so no storage service is needed.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: combat_dnd
      POSTGRES_USER: combat
      POSTGRES_PASSWORD: combat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Lets `docker compose up --wait` (used by scripts/dev.sh) return only once Postgres accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U combat -d combat_dnd"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
