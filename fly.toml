# Fly.io config. Set the app name and region before the first `fly launch`.
# Secrets (never in this file): fly secrets set DATABASE_URL=... DATABASE_USER=... DATABASE_PASSWORD=...
app = "combat-dnd"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Combat state, locks and SSE connections live in memory: exactly one machine, always running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/actuator/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
