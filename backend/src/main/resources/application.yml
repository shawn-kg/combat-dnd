spring:
  application:
    name: combat-dnd
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/combat_dnd}
    username: ${DATABASE_USER:combat}
    password: ${DATABASE_PASSWORD:combat}
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Portrait uploads; the server shrinks them to 256 x 256 JPEGs of a few KB.
      max-file-size: 5MB
      max-request-size: 6MB

combat:
  portraits:
    # Local folder for uploaded portraits. Deployment switches this to Cloudflare R2.
    dir: ${PORTRAITS_DIR:./data/portraits}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
