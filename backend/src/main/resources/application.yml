spring:
  application:
    name: combat-dnd
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/combat_dnd}
    username: ${DATABASE_USER:combat}
    password: ${DATABASE_PASSWORD:combat}
    hikari:
      # Small pool, and no idle connections kept open, so the free Neon database can sleep between sessions.
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Portrait uploads; the server shrinks them to 256 x 256 JPEGs of a few KB.
      max-file-size: 5MB
      max-request-size: 6MB

server:
  # Hosts like Render pass the port to listen on in PORT.
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # The host checks /actuator/health constantly. Without this it would query the database each time and
    # keep the free Neon database from ever sleeping. Startup (Flyway) already fails if the database is unreachable.
    db:
      enabled: false
